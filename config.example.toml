# LexiSwitch configuration.
#
# Copy to %APPDATA%\LexiSwitch\config.toml and edit. Every value below is the default, so a
# missing file, an empty file, or a file with only the sections you care about all behave
# identically to this one.
#
# The file is re-read when it changes on disk. A file that fails validation is rejected
# whole — the last configuration that did validate stays in effect, and the tray reports
# what was wrong and on which line. There is no half-applied state.
#
# Settings that no longer exist are ignored rather than rejected, and the ones that were
# ignored are named at startup. That is deliberate: rejecting them would stop the program
# starting after an upgrade, and dropping them silently would make a removed setting
# indistinguishable from one you misspelled.

[hotkeys]
# Bindings are "Modifier+Modifier+Key". Recognised modifiers: Ctrl, Alt, Shift, Win.
#
# Pause is the default because Windows leaves it unbound and almost nothing claims it.
# Keyboards without a Pause key need this rebound. If another application already holds the
# combination, startup fails loudly and says which one — it does not silently continue with
# a hotkey that will never fire.
#
# Select text, then press this. Nothing happens to text you have not selected, and nothing
# happens until you press it.
convert_selection = "Shift+Pause"

[layouts]
# Preferred order by language tag — for example ["en-US", "de-DE"].
#
# Empty means: use the order Windows reports the installed layouts in.
candidates = []

[selection]
# When converting a selection, LexiSwitch first tries the accessibility text pattern, which
# reads the selection without touching the clipboard. Where an application does not expose
# one — Notepad++ and browsers, for instance — it can fall back to copy-and-read instead.
#
# The fallback puts your selected text on the clipboard briefly, where clipboard managers
# and Windows Clipboard History can see it. That is inherent to the mechanism and identical
# to pressing Ctrl+C yourself. Set false to refuse the fallback: selection conversion then
# reports "unsupported here" instead of using the clipboard.
#
# Note that the *replacement* always uses the clipboard, whichever way the selection was
# read, because pasting is what makes a conversion one undo step instead of one per
# character. Text LexiSwitch puts there is marked to stay out of Clipboard History, which
# compliant clipboard managers honour — see docs/adr/0010-paste-selection-replacement.md.
allow_clipboard_fallback = true

[logging]
# Off by default. When enabled, records event kinds and lengths only — "converted_word
# len=7" — never the text itself, neither before nor after conversion. Nothing you typed or
# selected is written to disk.
enabled = false
