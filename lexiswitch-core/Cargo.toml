[package]
name = "lexiswitch-core"
description = "Layout conversion and config types. No OS dependency."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Deliberately empty, and the emptiness is the point (ADR-0001): this crate cannot reach
# Win32 because it depends on nothing that can. Anything added here must build and test on
# a machine with no Windows APIs present.
[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"

[dev-dependencies]
# Test-only, and the distinction matters. In production `lexiswitch-win` probes
# `ToUnicodeEx` and hands this crate plain data — JSON never appears at runtime, so a JSON
# parser must never reach the shipped binary or the 5 MB budget. `LayoutTable` therefore
# takes plain entries, and reading fixtures is something only the tests know how to do.
serde_json = "1"
